<div class="pagination">
  <p>
    @if (loading) {
      Loading {{ itemLabel }}...
    } @else {
      Showing {{ firstItem }}&ndash;{{ lastItem }} of {{ totalCount }} {{ itemLabel }}
    }
  </p>
  @if (showPageSize) {
  <label class="page-size-control">
    <span>Items per page</span>
    <select [ngModel]="pageSize" (ngModelChange)="changePageSize($event)" [disabled]="loading">
      @for (size of pageSizeOptions; track size) {
        <option [ngValue]="size">{{ size }}</option>
      }
    </select>
  </label>
  }
  <nav class="page-controls" aria-label="Pagination">
    <button
      type="button"
      (click)="changePage(currentPage - 1)"
      [disabled]="loading || currentPage <= 1"
    >
      Previous
    </button>
    <span aria-live="polite">Page {{ currentPage }} of {{ totalPages }}</span>
    <button
      type="button"
      (click)="changePage(currentPage + 1)"
      [disabled]="loading || currentPage >= totalPages"
    >
      Next
    </button>
  </nav>
</div>
